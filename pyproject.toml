[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ahrs"
version = "0.1.0"
description = "Attitude and Heading Reference System tools in Python"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "AHRS contributors" },
]
dependencies = [
  "PySide6>=6.7",
]

[project.gui-scripts]
ahrs-ui = "ahrs.app:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ahrs"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
